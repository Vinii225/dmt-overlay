[project]
name = "dmt-overlay"
dynamic = ["version"]
description = "Overlays leves de telemetria para Le Mans Ultimate, feitos pela DMT - Damata Racing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vinícius Ares" }]
dependencies = ["PySide6-Essentials>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
dmt-overlay = "dmt_overlay.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "dmt_overlay.__version__" }

[tool.setuptools.packages.find]
include = ["dmt_overlay*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["dmt_overlay/terceiros"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
